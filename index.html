<style>
/* ---------- tokens ---------- */
:root{
  --paper:#FFFFFF;
  --ink:#000000;
  --grey:#8C8C8C;
  --mist:#E9E9E9;
  --blue:#1F3BE0;          /* the only accent */
  --bar:28px;
  --dock:72px;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:#fff;
  overflow:hidden;-webkit-font-smoothing:antialiased;
  user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
html[lang="ko"] .en, html[lang="en"] .ko{display:none !important}
.ios{display:none}

/* ---------- wallpaper ---------- */
.wall{position:fixed;inset:0;z-index:0;background:#fff}

/* ---------- mac menu bar ---------- */
.menubar{
  position:fixed;top:0;left:0;right:0;height:var(--bar);z-index:9000;
  display:flex;align-items:center;gap:18px;padding:0 14px;
  background:rgba(255,255,255,.85);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--mist);font-size:13px;
}
.menubar .brand{font-weight:800;letter-spacing:-.02em}
.halo{display:inline-block;width:14px;height:14px;border:1.6px solid var(--ink);border-radius:50%;vertical-align:-2px;margin-right:6px}
.menu{position:relative}
.menu > button{padding:3px 8px;border-radius:4px}
.menu > button[aria-expanded="true"]{background:rgba(0,0,0,.1)}
.menu ul{
  display:none;position:absolute;top:24px;left:0;min-width:220px;list-style:none;
  background:rgba(255,255,255,.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(0,0,0,.12);border-radius:8px;padding:5px;box-shadow:0 12px 32px rgba(0,0,0,.22);
}
.menu > button[aria-expanded="true"] + ul{display:block}
.menu li button{width:100%;text-align:left;padding:4px 10px;border-radius:4px}
.menu li button:hover,.menu li button:focus-visible{background:var(--blue);color:#fff;outline:none}
.menu li hr{border:0;border-top:1px solid rgba(0,0,0,.12);margin:4px 6px}
.spacer{flex:1}
.lang{display:flex;border:1px solid var(--ink);border-radius:4px;overflow:hidden;font-size:11px;font-weight:700}
.lang button{padding:1px 7px}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.clock{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- mac desktop icons ---------- */
.desktop{
  position:fixed;top:calc(var(--bar) + 14px);right:14px;bottom:calc(var(--dock) + 24px);left:14px;z-index:1;
  display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,100px);
  grid-auto-columns:96px;justify-content:start;direction:rtl;gap:2px 8px;
}
.icon{direction:ltr;width:96px;height:100px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:4px;border-radius:6px}
.icon .glyph{width:58px;height:58px;display:grid;place-items:center;border-radius:6px;padding:2px}
.icon .glyph svg{width:52px;height:52px}
.icon .label{font-size:12px;line-height:1.25;text-align:center;color:var(--ink);font-weight:500;padding:1px 4px;border-radius:3px;max-width:92px;overflow-wrap:anywhere}
.tag{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--blue);margin-left:4px;vertical-align:1px}
.icon.selected .glyph{background:rgba(0,0,0,.08)}
.icon.selected .label{background:var(--blue);color:#fff}
.icon:focus-visible{outline:none}
.icon:focus-visible .label{outline:2px solid var(--blue)}
.hint{position:fixed;left:18px;bottom:calc(var(--dock) + 26px);z-index:1;color:var(--grey);font-size:12px}

/* ---------- windows ---------- */
.win{
  position:fixed;z-index:10;display:flex;flex-direction:column;
  background:var(--paper);border:1px solid rgba(0,0,0,.85);border-radius:10px;overflow:hidden;
  box-shadow:0 22px 50px rgba(0,0,0,.16),0 2px 6px rgba(0,0,0,.08);
  min-width:300px;max-width:calc(100vw - 16px);max-height:calc(100vh - var(--bar) - var(--dock) - 24px);
  transform-origin:var(--ox,50%) var(--oy,50%);
  animation:open .22s cubic-bezier(.2,.8,.2,1);
}
.win.blur .titlebar{color:var(--grey)}
.win.blur .lights button{border-color:var(--grey)}
@keyframes open{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
.win.closing{animation:close .16s ease-in forwards}
@keyframes close{to{opacity:0;transform:scale(.94)}}
.win.minimizing{animation:mini .32s cubic-bezier(.5,0,.75,0) forwards}
@keyframes mini{to{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.08)}}
.win.max{left:8px !important;top:calc(var(--bar) + 8px) !important;width:calc(100vw - 16px) !important;height:calc(100vh - var(--bar) - var(--dock) - 28px) !important}
.titlebar{height:36px;flex:none;display:flex;align-items:center;padding:0 12px;gap:8px;border-bottom:1px solid var(--mist);cursor:grab;touch-action:none;font-size:13px;font-weight:600;position:relative}
.titlebar:active{cursor:grabbing}
.titlebar .title{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.lights{display:flex;gap:8px;position:relative;z-index:1}
.lights button{width:13px;height:13px;border-radius:50%;border:1.4px solid var(--ink);display:grid;place-items:center;padding:0}
.lights svg{width:7px;height:7px;opacity:0}
.lights:hover svg,.lights button:focus-visible svg{opacity:1}
.lights button:hover{background:var(--ink);color:#fff}
.done{display:none}
.body{overflow:auto;flex:1;user-select:text;-webkit-user-select:text;overscroll-behavior:contain}

/* ---------- window content ---------- */
.ad{padding:34px 36px 32px;display:grid;gap:22px}
.kicker{font-size:12px;color:var(--grey);font-weight:500}
.headline{font-size:clamp(30px,4.2vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.035em;word-break:keep-all;max-width:16ch}
.vision{font-size:clamp(24px,3vw,32px);line-height:1.18;font-weight:750;letter-spacing:-.03em;max-width:22ch;text-indent:-.42em}
.attrib{font-size:12px;color:var(--grey);margin-top:-12px}
.copy{font-size:15px;line-height:1.7;max-width:44ch;word-break:keep-all;color:#1a1a1a}
.did{display:flex;flex-wrap:wrap;gap:6px}
.did span{font-size:13px;border:1px solid var(--ink);border-radius:999px;padding:4px 11px}
.did span.role{background:var(--ink);color:#fff}
.sign{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid var(--ink);padding-top:12px;font-size:12px;gap:12px}
.sign b{font-weight:800;font-size:15px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.linkish{color:var(--blue);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
.pull{font-size:clamp(24px,3vw,30px);font-weight:800;letter-spacing:-.03em;line-height:1.25;border-top:1px solid var(--ink);padding-top:18px;word-break:keep-all}

/* career ruler (about) */
.ruler{display:grid;gap:6px}
.ruler .track{display:flex;height:30px;border-radius:3px;overflow:hidden;font-size:12px;font-weight:700;color:#fff}
.ruler .seg-fpa{background:var(--ink);display:flex;align-items:center;padding-left:10px}
.ruler .seg-ma{background:var(--blue);display:flex;align-items:center;padding-left:8px;white-space:nowrap}
.ruler .ticks{position:relative;height:66px;font-size:11px}
.ruler .ticks button.low{padding-top:36px}
.ruler .ticks button{position:absolute;top:0;padding-top:7px;border-left:1px solid var(--ink);padding-left:5px;text-align:left;line-height:1.25;white-space:nowrap}
.ruler .ticks button span{display:block;color:var(--grey);font-variant-numeric:tabular-nums}
.ruler .ticks button:hover{color:var(--blue)}

/* ange */
.ange{min-height:100%;display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1fr)}
.ange .photo{background:var(--ange) center 30%/cover #ddd;min-height:300px;transition:filter .5s ease}
.ange .side{padding:28px 28px 24px;display:flex;flex-direction:column;gap:16px}
.ange .headline{font-size:clamp(28px,3.4vw,38px)}
.like{align-self:flex-start;width:48px;height:48px;display:grid;place-items:center;margin-left:-8px}
.like svg{width:32px;height:32px;fill:none;stroke:var(--ink);stroke-width:1.8;transition:transform .2s}
.like[aria-pressed="true"] svg{fill:#ED4956;stroke:#ED4956;animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.small{font-size:12px;color:var(--grey);line-height:1.5}
.heart{position:fixed;pointer-events:none;z-index:99999;font-size:22px;color:#ED4956;animation:float 1s ease-out forwards}
@keyframes float{to{transform:translateY(-70px) scale(1.4);opacity:0}}

/* books */
.shelf{display:flex;align-items:flex-end;gap:3px;height:130px;border-bottom:3px solid var(--ink);padding:0 4px}
.shelf button{flex:1 1 0;max-width:22px;min-width:0;background:var(--ink);border-radius:1px 1px 0 0;padding:0;transition:transform .15s}
.shelf button:nth-child(3n){background:#333}
.shelf button:nth-child(4n+1){background:#555}
.shelf button.five{background:var(--blue)}
.shelf button:hover{transform:translateY(-6px)}
.shelf button[aria-pressed="true"]{outline:2px solid var(--blue);outline-offset:2px}
.stars{display:flex;gap:3px}
.stars svg{width:22px;height:22px}
.fav{display:grid;grid-template-columns:96px 1fr;gap:18px;align-items:center;border:1px solid var(--ink);border-radius:8px;padding:16px}
.cover{aspect-ratio:2/3;background:var(--ink);color:#fff;border-radius:2px 4px 4px 2px;padding:10px 8px;display:flex;flex-direction:column;justify-content:space-between;font-size:11px;box-shadow:inset 4px 0 0 rgba(255,255,255,.18)}
.cover b{font-size:13px;line-height:1.2;letter-spacing:-.03em;word-break:keep-all;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.cover span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ptitle{font-size:16px;font-weight:700;line-height:1.35;letter-spacing:-.02em;word-break:keep-all}

/* ax lab: scenario model */
.segc{justify-self:start;display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden;font-size:13px;font-weight:600}
.segc button{padding:6px 14px}
.segc button[aria-pressed="true"]{background:var(--ink);color:#fff}
.sheet{border:1px solid var(--ink);border-radius:6px;overflow:hidden;font-size:13px}
.sheet .r{display:grid;grid-template-columns:1fr 64px 1.2fr;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--mist)}
.sheet .r:first-child{border-top:0}
.sheet output{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.sheet input[type=range]{width:100%;accent-color:var(--blue)}
.legend{display:flex;gap:16px;font-size:12px;color:#444;margin-bottom:6px}
.legend > span{display:flex;align-items:center;gap:6px}
.legend .ln{width:18px;height:0;border-top:2.5px solid var(--blue)}
.legend .bx{width:10px;height:10px;background:#cfd6ff;border:1px solid var(--blue)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.ev{display:grid;gap:8px;font-size:13px}
.ev .row{display:grid;grid-template-columns:52px 1fr 58px 96px;align-items:center;gap:10px}
.ev .mx{font-size:12px;color:var(--grey);text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.ev .row.on .mx{color:var(--blue)}
.ev .cap{font-size:12px;color:var(--grey);line-height:1.5}
.ev .bar{height:18px;background:var(--mist);border-radius:2px;position:relative}
.ev .bar i{position:absolute;left:0;top:0;bottom:0;background:#bdbdbd;border-radius:2px;transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ev .row.on .bar i{background:var(--blue)}
.ev .row.on{font-weight:700}
.ev b{text-align:right;font-variant-numeric:tabular-nums}
.reset{justify-self:start;font-size:12px;color:var(--grey);text-decoration:underline;text-underline-offset:3px}

/* contact */
.contact .big{font-size:clamp(20px,3vw,28px);font-weight:800;letter-spacing:-.03em;word-break:break-all}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--ink);border-radius:999px;padding:8px 16px;font-size:14px;font-weight:600;text-decoration:none;color:var(--ink)}
.btn.solid{background:var(--ink);color:#fff}
.btn:hover{background:var(--blue);border-color:var(--blue);color:#fff}

/* empty trash */
.empty{height:100%;display:grid;place-items:center;align-content:center;gap:6px;color:var(--grey);font-size:14px;padding:30px}
.empty b{color:var(--ink);font-size:15px}

/* ---------- mac dock ---------- */
.dock{
  position:fixed;left:50%;bottom:8px;transform:translateX(-50%);z-index:9000;
  height:62px;display:flex;align-items:center;gap:6px;padding:6px 10px;

.dock .dot::before{content:"";position:absolute;bottom:-5px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink)}
#miniSlot{display:contents}

.toast{position:fixed;left:50%;top:calc(var(--bar) + 14px);transform:translateX(-50%);z-index:99999;background:var(--ink);color:#fff;font-size:13px;padding:8px 16px;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}

<template id="tpl-about">
  <div class="ad">
    <p class="kicker">About</p>
    <h1 class="headline"><span class="ko">안녕하세요, 김지원입니다.</span><span class="en">Hi, I’m Jiwon Kim.</span></h1>
    <p class="copy">
      <span class="ko">처음 10년은 FP&amp;A(Financial Planning &amp; Analysis) 직무로 일했습니다. 사업이 굴러가는 숫자를 계획하고, 매달 그 숫자가 맞게 가는지 확인하는 일이요. 2년 전부터는 M&amp;A 실행을 담당하고 있습니다. 이번엔 회사 전체에 값을 매기는 일이에요.</span>
      <span class="en">For my first ten years I worked in FP&amp;A (Financial Planning &amp; Analysis): planning the numbers a business runs on, and checking every month that they held. Two years ago I moved to executing M&amp;A. Now I put a price on the whole company.</span>
    </p>
    <div class="ruler" id="ruler">
      <div class="track"><span class="seg-fpa">FP&amp;A</span><span class="seg-ma">M&amp;A</span></div>
      <div class="ticks"></div>
    </div>
    <p class="copy"><span class="ko">그사이 산업은 세 번 바뀌었지만 제 일의 본질은 동일합니다.</span><span class="en">The industry changed three times. The core of my work did not.</span></p>
    <p class="pull"><span class="ko">“그래서, 이 숫자가 말이 되나?”</span><span class="en">“So, do these numbers add up?”</span></p>
  </div>
</template>

<template id="tpl-fmcg">
  <div class="ad">
    <p class="kicker">FMCG</p>
    <h2 class="vision">“Bringing People Together for a Better World”</h2>
    <p class="copy"><span class="ko">첫 회사에서 FP&amp;A로 일을 배웠습니다. 매달 전사 실적을 챙기고 연말 손익이 어디쯤 닿을지 예측했어요. 새 프로젝트 제안이 들어오면 해 볼 만한 사업인지 숫자로 따져 봤고, 회사의 돈이 언제 들어오고 나가는지 자금수지를 짜면서 어디에 투자할지 계획을 세우고 굴렸습니다.</span><span class="en">My first company is where I learned FP&amp;A. Every month I tracked company-wide results and forecast where the year’s P&amp;L would land. When a new project proposal came in, I worked out whether it was worth doing. I also mapped when cash came in and went out, and planned and ran where we would invest it.</span></p>
    <div class="did"><span class="role">FP&amp;A</span><span class="ko">실적 관리</span><span class="en">Performance tracking</span><span class="ko">손익 예측</span><span class="en">P&amp;L forecasting</span><span class="ko">사업타당성 검토</span><span class="en">Feasibility review</span><span class="ko">자금수지·투자계획</span><span class="en">Cash flow &amp; investment plans</span></div>

<template id="tpl-ecom">

  function appBtn(id){
    const isLink = id === "linkedin";
    const el = document.createElement(isLink ? "a" : "button");
    el.className = "app";
    if (isLink){ el.href = LINKEDIN; el.target = "_blank"; el.rel = "noopener"; }
    else el.addEventListener("click", () => openWin(id, el));
    const d = W[id] || {};
    const cls = "sq";
    el.innerHTML = `<span class="${cls}">${APPG[id]}${d.tag ? '<i class="badge"></i>' : ""}</span><span class="n">${isLink ? "LinkedIn" : L(d.app)}</span>`;
    el.setAttribute("aria-label", isLink ? "LinkedIn" : (typeof d.app === "string" ? d.app : d.app.en));
    return el;
  }
  HOME.forEach(id => home.appendChild(appBtn(id)));
  IDOCK.forEach(id => idock.appendChild(appBtn(id)));

  /* ---------- windows ---------- */
  const open = {};
  let z = 20, cascade = 0;
  const lightsHTML = `<div class="lights">
    <button class="close" aria-label="Close"><svg viewBox="0 0 8 8"><path d="M1 1l6 6M7 1L1 7" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="min" aria-label="Minimise"><svg viewBox="0 0 8 8"><path d="M1 4h6" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="max" aria-label="Zoom"><svg viewBox="0 0 8 8"><path d="M1 4h6M4 1v6" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>`;

  function focusWin(el){
    Object.values(open).forEach(o => o.el.classList.add("blur"));
    el.classList.remove("blur");
    el.style.zIndex = ++z;
  }

  function openWin(id, fromEl){
    const d = W[id]; if (!d) return;
    closeMenus();
    if (open[id]){ const o = open[id]; if (o.minimized) restore(id); else focusWin(o.el); return; }
    if (phone()) Object.keys(open).forEach(k => closeWin(k, true));   // one app at a time on a phone
    const el = document.createElement("section");
    el.className = "win"; el.setAttribute("role","dialog"); el.setAttribute("aria-label", d.en);
    const title = phone() && d.app ? L(d.app) : L({ko:d.ko,en:d.en});
    el.innerHTML = `<div class="titlebar">${lightsHTML}<div class="title">${title}</div><button class="done">${L({ko:"완료",en:"Done"})}</button></div><div class="body"></div>`;
    el.querySelector(".body").appendChild(document.getElementById("tpl-"+id).content.cloneNode(true));

    const vw = innerWidth, vh = innerHeight;
    const w = Math.min(d.w, vw - 40), h = Math.min(d.h, vh - 28 - 72 - 40);
    const left = vw > 1100 ? Math.round(vw*0.04 + (cascade % 6) * 34) : Math.max(12, Math.round((vw - w)/2 - 160 + (cascade % 6) * 34));
    const top = Math.max(40, Math.round(28 + (vh - 28 - 72 - h)/2 - 40 + (cascade % 6) * 26));
    cascade++;
    Object.assign(el.style, {width:w+"px", height:h+"px", left:left+"px", top:top+"px"});
    if (fromEl){
      const r = fromEl.getBoundingClientRect();
      el.style.setProperty("--ox", (r.left + r.width/2 - left)+"px");
      el.style.setProperty("--oy", (r.top + r.height/2 - top)+"px");
    }
    document.body.appendChild(el);
    if (!phone() && id !== "books"){ const c = el.querySelector(".body").firstElementChild, need = (c && !c.classList.contains("ange") ? c.offsetHeight : h) + 38; if (need < h) el.style.height = need + "px"; }
    open[id] = {el, minimized:false};
    focusWin(el);

    el.addEventListener("pointerdown", () => focusWin(el));
    el.querySelector(".close").addEventListener("click", e => { e.stopPropagation(); closeWin(id); });
    el.querySelector(".done").addEventListener("click", e => { e.stopPropagation(); closeWin(id); });
    el.querySelector(".min").addEventListener("click", e => { e.stopPropagation(); minimize(id); });
    el.querySelector(".max").addEventListener("click", e => { e.stopPropagation(); el.classList.toggle("max"); });
    el.querySelector(".titlebar").addEventListener("dblclick", e => { if (!e.target.closest(".lights")) el.classList.toggle("max"); });
    drag(el);
    el.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openWin(b.dataset.open, b)));
    setup[id] && setup[id](el);
    (phone() ? el.querySelector(".done") : el.querySelector(".close")).focus({preventScroll:true});
  }

  function closeWin(id, instant){
    const o = open[id]; if (!o) return;
    delete open[id];
    removeMini(id);
    if (instant) { o.el.remove(); return; }
    o.el.classList.add("closing");
    setTimeout(() => o.el.remove(), phone() ? 230 : 170);
  }

  const miniSlot = document.getElementById("miniSlot");
  function minimize(id){
    const o = open[id]; if (!o || o.minimized) return;
    const slot = addMini(id);
    const r = o.el.getBoundingClientRect(), s = slot.getBoundingClientRect();
    o.el.style.setProperty("--dx", (s.left + s.width/2 - (r.left + r.width/2))+"px");
    o.el.style.setProperty("--dy", (s.top + s.height/2 - (r.top + r.height/2))+"px");
    o.el.style.transformOrigin = "50% 50%";
    o.el.classList.add("minimizing");
    o.minimized = true;
    setTimeout(() => { o.el.style.display = "none"; o.el.classList.remove("minimizing"); }, 330);
  }
  function restore(id){
    const o = open[id]; if (!o) return;
    removeMini(id);
    o.el.style.display = ""; o.minimized = false;
    o.el.style.animation = "none"; o.el.offsetHeight; o.el.style.animation = "";
    focusWin(o.el);
  }
  function addMini(id){
    const d = W[id];
    const b = document.createElement("button");
    b.className = "d dot"; b.dataset.mini = id; b.dataset.tip = t(d.ko, d.en);
    b.innerHTML = `<span class="mini">${L({ko:d.ko,en:d.en})}</span>`;
    b.addEventListener("click", () => restore(id));
    miniSlot.appendChild(b);
    return b;
  }
  function removeMini(id){ const m = miniSlot.querySelector(`[data-mini="${id}"]`); if (m) m.remove(); }

  function drag(el){
    const bar = el.querySelector(".titlebar");
    let sx, sy, ox, oy, on = false;
    bar.addEventListener("pointerdown", e => {
      if (phone() || e.target.closest(".lights") || el.classList.contains("max")) return;
      on = true; sx = e.clientX; sy = e.clientY; ox = el.offsetLeft; oy = el.offsetTop;
      bar.setPointerCapture(e.pointerId);
    });
    bar.addEventListener("pointermove", e => {
      if (!on) return;
      el.style.left = Math.min(innerWidth - 80, Math.max(80 - el.offsetWidth, ox + e.clientX - sx)) + "px";
      el.style.top = Math.min(innerHeight - 60, Math.max(28, oy + e.clientY - sy)) + "px";
    });
    const end = () => on = false;
    bar.addEventListener("pointerup", end); bar.addEventListener("pointercancel", end);
  }

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    if (document.querySelector('.menu > button[aria-expanded="true"]')) { closeMenus(); return; }
    let top = null, tz = -1;
    for (const [id,o] of Object.entries(open)) if (!o.minimized && +o.el.style.zIndex > tz){ tz = +o.el.style.zIndex; top = id; }
    if (top) closeWin(top);
  });

  /* ---------- per-window behaviour ---------- */
  const setup = {
    about(el){
      const now = new Date(), start = 2014, end = now.getFullYear() + now.getMonth()/12;
      const span = end - start, pct = y => ((y - start)/span*100);
      el.querySelector(".seg-fpa").style.width = pct(2024) + "%";
      el.querySelector(".seg-ma").style.width = (100 - pct(2024)) + "%";
      const ticks = el.querySelector(".ticks");
      CAREER.forEach((c,i) => {
        const b = document.createElement("button");
        b.style.left = pct(c.y) + "%";
        if (i === 2) b.classList.add("low");
        if (i === CAREER.length - 1){ b.style.left = "auto"; b.style.right = "0"; b.style.borderLeft = "0"; b.style.borderRight = "1px solid #000"; b.style.paddingLeft = "0"; b.style.paddingRight = "5px"; b.style.textAlign = "right"; }
        b.innerHTML = `${c.n}<span>${c.y}</span>`;
        b.addEventListener("click", () => openWin(c.id, b));
        ticks.appendChild(b);
      });
      const paint = () => {
        el.querySelector(".seg-fpa").textContent = t("FP&A 10년", "FP&A, 10 years");
        el.querySelector(".seg-ma").textContent = t("M&A 2년", "M&A, 2 years");
      };
      paint(); el._repaint = paint;
    },
    ange(el){
      const photo = el.querySelector("#angePhoto"), like = el.querySelector("#like");
      let on = store.get("ange-liked") === "1";
      const paint = () => {
        photo.style.filter = on ? "none" : "grayscale(1)";
        like.setAttribute("aria-pressed", on);
      };
      paint();
      like.addEventListener("click", e => {
        on = !on; store.set("ange-liked", on ? "1" : "0"); paint();
        if (on){
          const h = document.createElement("span");
          h.className = "heart"; h.textContent = "♥";
          h.style.left = (e.clientX - 8) + "px"; h.style.top = (e.clientY - 24) + "px";
          document.body.appendChild(h); setTimeout(() => h.remove(), 1000);
        }
      });
    },
    books(el){
      const shelf = el.querySelector("#shelf");
      const STAR = "M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3l-5.9 3.3 1.3-6.6-4.9-4.6 6.6-.8z";
      let sel = BOOKS.findIndex(b => b[2] === 5);
      BOOKS.forEach((b,i) => {
        const s = document.createElement("button");
        s.style.height = (b[2]/5*100) + "%";
        if (b[2] === 5) s.classList.add("five");
        s.setAttribute("aria-label", `${b[3]}, ${b[4]}, ${b[2]}`);
        s.addEventListener("click", () => { sel = i; paint(); });
        s.addEventListener("mouseenter", () => { sel = i; paint(); });
        shelf.appendChild(s);
      });
      const paint = () => {
        const B = BOOKS[sel], r = B[2];
        const title = t(B[0], B[3]), author = t(B[1], B[4]);
        shelf.querySelectorAll("button").forEach((x,i) => x.setAttribute("aria-pressed", i === sel));
        el.querySelector("#pickT").textContent = title;
        el.querySelector("#pickA").textContent = author;
        el.querySelector("#pickTitle").textContent = title;
        el.querySelector("#pickBy").textContent = author;
        el.querySelector("#pickN").textContent = t(`${sel+1}번째 책`, `Book ${sel+1} of ${BOOKS.length}`);
        const star = fill => `<svg viewBox="0 0 24 24"><defs><clipPath id="h${sel}"><rect x="0" y="0" width="12" height="24"/></clipPath></defs><path d="${STAR}" fill="#E9E9E9"/>${fill ? `<path d="${STAR}" fill="#000" ${fill === .5 ? `clip-path="url(#h${sel})"` : ""}/>` : ""}</svg>`;
        el.querySelector("#pickS").innerHTML = [1,2,3,4,5].map(i => star(r >= i ? 1 : r >= i - .5 ? .5 : 0)).join("");
        el.querySelector("#pickR").textContent = t(`내 평점 ${r} / 5`, `My rating ${r} / 5`);
        el.querySelector("#pick .cover").style.background = r === 5 ? "var(--blue)" : "var(--ink)";
      };
      paint(); el._repaint = paint;
    },
    ax(el){
      const HIST = [[2023,820,11.0],[2024,905,12.0],[2025,980,12.5]];   // year, revenue, EBITDA margin %
      const YEARS = [2026,2027,2028];
      const DEF = {worst:{g:2,m:9}, base:{g:7,m:12}, best:{g:12,m:15}};
      const MULT = {worst:6.0, base:7.0, best:8.0};                      // EBITDA multiple per LOU terms (illustrative)
      const A = JSON.parse(JSON.stringify(DEF));
      const NAMES = {worst:["비관","Worst"], base:["중립","Base"], best:["낙관","Best"]};
      const KS = ["worst","base","best"];
      let cur = "base";
      const g = el.querySelector("#g"), m = el.querySelector("#m"), gOut = el.querySelector("#gOut"), mOut = el.querySelector("#mOut");
      const chart = el.querySelector("#chart"), ev = el.querySelector("#ev");
      const proj = k => { let r = HIST[2][1]; return YEARS.map(y => (r = r * (1 + A[k].g/100), [y, r])); };
      const value = k => Math.round(proj(k)[2][1] * A[k].m/100 * MULT[k]);
      const fmt = v => Math.round(v).toLocaleString("en-US");
      const nm = k => t(NAMES[k][0], NAMES[k][1]);

      function draw(){
        g.value = A[cur].g; m.value = A[cur].m;
        gOut.textContent = (+A[cur].g).toFixed(1) + "%";
        mOut.textContent = (+A[cur].m).toFixed(1) + "%";
        const W0 = 520, H0 = 230, P = {l:8, r:58, t:14, b:24};
        const yrs = [2023,2024,2025,2026,2027,2028];
        const step = (W0 - P.l - P.r) / yrs.length;
        const x = y => P.l + step * (yrs.indexOf(y) + .5);
        // revenue line lives in the top part, margin bars in the bottom part
        const all = KS.flatMap(k => proj(k).map(p => p[1])).concat(HIST.map(h => h[1]));
        const lo = Math.min(...all), hi = Math.max(...all);
        const lineTop = P.t, lineBot = H0 * .52;
        const yv = v => lineBot - (v - lo)/(hi - lo || 1) * (lineBot - lineTop);
        const base = H0 - P.b, barMax = H0 * .34, bw = step * .46;
        const bh = pct => pct / 30 * barMax;
        const line = pts => pts.map((p,i) => (i?"L":"M") + x(p[0]).toFixed(1) + " " + yv(p[1]).toFixed(1)).join(" ");
        let s = `<svg viewBox="0 0 ${W0} ${H0}" role="img" aria-label="Revenue line and EBITDA margin bars">`;
        // margin bars
        const margins = HIST.map(h => [h[0], h[2], false]).concat(YEARS.map(y => [y, A[cur].m, true]));
        margins.forEach(([y, pct, f]) => {
          const h = bh(pct);
          s += `<rect x="${x(y)-bw/2}" y="${base-h}" width="${bw}" height="${h}" fill="${f ? "#cfd6ff" : "#E9E9E9"}" stroke="${f ? "#1F3BE0" : "#bdbdbd"}" stroke-width="1"/>`;
          s += `<text x="${x(y)}" y="${base-h-4}" font-size="10.5" text-anchor="middle" fill="${f ? "#1F3BE0" : "#8C8C8C"}">${pct.toFixed(1)}%</text>`;
        });
        s += `<line x1="${P.l}" x2="${W0-P.r}" y1="${base}" y2="${base}" stroke="#000"/>`;
        s += `<line x1="${(x(2025)+x(2026))/2}" x2="${(x(2025)+x(2026))/2}" y1="${P.t}" y2="${base}" stroke="#E9E9E9" stroke-dasharray="3 3"/>`;
        // scenario lines: names stay fixed at the line ends
        KS.forEach(k => {
          const pts = [HIST[2]].concat(proj(k)), on = k === cur;
          s += `<path d="${line(pts)}" fill="none" stroke="${on ? "#1F3BE0" : "#bdbdbd"}" stroke-width="${on ? 2.6 : 1.5}" ${on ? "" : 'stroke-dasharray="4 4"'}/>`;
          const e = pts[pts.length-1];
          s += `<text x="${x(e[0])+8}" y="${yv(e[1])+4}" font-size="11.5" font-weight="${on ? 700 : 400}" fill="${on ? "#1F3BE0" : "#8C8C8C"}">${nm(k)}</text>`;
        });
        s += `<path d="${line(HIST)}" fill="none" stroke="#000" stroke-width="2.2"/>`;
        HIST.forEach(h => s += `<circle cx="${x(h[0])}" cy="${yv(h[1])}" r="3" fill="#000"/>`);
        yrs.forEach(y => s += `<text x="${x(y)}" y="${H0-6}" font-size="10.5" fill="#8C8C8C" text-anchor="middle">’${String(y).slice(2)}${y>2025?"E":""}</text>`);
        s += `<text x="${(x(2025)+x(2026))/2-5}" y="${P.t+4}" font-size="10.5" fill="#8C8C8C" text-anchor="end">${t("실적","Actual")}</text><text x="${(x(2025)+x(2026))/2+5}" y="${P.t+4}" font-size="10.5" fill="#8C8C8C">${t("예상","Projected")}</text>`;
        chart.innerHTML = s + `</svg>`;
        // implied value
        const vals = Object.fromEntries(KS.map(k => [k, value(k)]));
        const max = Math.max(...Object.values(vals), 1) * 1.05;
        ev.innerHTML = `<div class="cap">${t("예상 기업가치 (억 원). LOU에서 협의한 산식에 따라 시나리오별 EBITDA 멀티플을 적용합니다.","Implied value (KRW 100m). The EBITDA multiple for each scenario follows the formula agreed in the LOU.")}</div>` +
          KS.map(k => `<div class="row${k===cur?" on":""}"><span>${nm(k)}</span><span class="bar"><i style="width:${Math.max(0,vals[k])/max*100}%"></i></span><b>${fmt(vals[k])}</b><span class="mx">EBITDA × ${MULT[k].toFixed(1)}${t("배","x")}</span></div>`).join("");
      }
      g.addEventListener("input", () => { A[cur].g = +g.value; draw(); });
      m.addEventListener("input", () => { A[cur].m = +m.value; draw(); });
      el.querySelectorAll("[data-sc]").forEach(b => b.addEventListener("click", () => {
        cur = b.dataset.sc;
        el.querySelectorAll("[data-sc]").forEach(x => x.setAttribute("aria-pressed", x === b));
        draw();
      }));
      el.querySelector("#reset").addEventListener("click", () => { Object.assign(A, JSON.parse(JSON.stringify(DEF))); draw(); });
      draw(); el._repaint = draw;
    },
    contact(el){
      el.querySelector("#copyMail").addEventListener("click", async () => {
        try { await navigator.clipboard.writeText("kimjiwon.emily@gmail.com"); toast(t("주소를 복사했어요.", "Address copied.")); }
        catch(e){ toast(t("복사할 수 없어요. 주소를 길게 눌러 선택해 주세요.", "Couldn’t copy. Select the address instead.")); }
      });
    }
  };

  /* ---------- menus ---------- */
  function closeMenus(){ document.querySelectorAll('.menu > button').forEach(b => b.setAttribute("aria-expanded","false")); }
  document.querySelectorAll(".menu > button").forEach(b => {
    b.addEventListener("click", e => {
      e.stopPropagation();
      const was = b.getAttribute("aria-expanded") === "true";
      closeMenus(); b.setAttribute("aria-expanded", !was);
    });
    b.addEventListener("mouseenter", () => {
      if (document.querySelector('.menu > button[aria-expanded="true"]') && b.getAttribute("aria-expanded") !== "true"){ closeMenus(); b.setAttribute("aria-expanded","true"); }
    });
  });
  document.addEventListener("click", e => { if (!e.target.closest(".menu")) closeMenus(); });
  document.querySelectorAll(".menubar [data-open], .dock [data-open], .home > [data-open]").forEach(b => b.addEventListener("click", () => openWin(b.dataset.open, b)));
  document.querySelector('[data-act="closeall"]').addEventListener("click", () => { closeMenus(); Object.keys(open).forEach(k => closeWin(k)); });

  /* ---------- language ---------- */
  function setLang(l){
    document.documentElement.lang = l;
    document.querySelectorAll("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === l));
    store.set("lang", l);
    Object.values(open).forEach(o => o.el._repaint && o.el._repaint());
    miniSlot.querySelectorAll("[data-mini]").forEach(m => m.dataset.tip = t(W[m.dataset.mini].ko, W[m.dataset.mini].en));
    tick();
  }
  document.querySelectorAll("[data-lang]").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));

  /* ---------- clocks ---------- */
  const clock = document.getElementById("clock"), iclock = document.getElementById("iclock");
  function tick(){
    const l = lang() === "en" ? "en-US" : "ko-KR", now = new Date();
    const date = new Intl.DateTimeFormat(l, {timeZone:"Asia/Seoul", month:"short", day:"numeric", weekday:"short"}).format(now);
    const p = new Intl.DateTimeFormat("en-GB", {timeZone:"Asia/Seoul", hour:"2-digit", minute:"2-digit", hourCycle:"h23"}).formatToParts(now);
    const time = p.find(x => x.type==="hour").value + ":" + p.find(x => x.type==="minute").value;
    clock.textContent = `${date}  ${time}`;
    iclock.textContent = time;
  }
  setInterval(tick, 15000);

  /* ---------- toast ---------- */
  const toastEl = document.getElementById("toast"); let tt;
  function toast(msg){ toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => toastEl.classList.remove("on"), 2200); }

  /* ---------- start ---------- */
  setLang(store.get("lang") || "ko");
  if (!phone()) setTimeout(() => openWin("about", desk.querySelector('[data-id="about"]')), 350);
})();
</script>
</body>
